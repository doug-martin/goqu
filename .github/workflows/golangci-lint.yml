name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout 5m
      # ./integration is a separate module, so the run above does not cover it.
      - name: golangci-lint (integration)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout 5m
          working-directory: integration
